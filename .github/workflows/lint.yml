name: lint

on:
  pull_request:
    paths:
      - .github/workflows/lint.yml
      - '**/*.rs'
      - Cargo.toml

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  lint:
    timeout-minutes: 5
    runs-on: ubuntu-22.04
    container: docker://ghcr.io/linkerd/dev:v44-rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: just fetch
      - run: just check-fmt
      - run: just clippy
      - run: just docs
